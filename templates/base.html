<!DOCTYPE html>
{% load i18n %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="utf-8">
    {% load static %}
    <meta name="description" content="Morden Bootstrap HTML5 Template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="{% static 'src/assets/img/favicon.ico' %}" type="image/x-icon">
    <link rel="icon" href="{% static 'src/assets/img/favicon.ico' %}" type="image/x-icon">

    <!-- Font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">

    <!-- ======= All CSS Plugins here ======== -->
    <link rel="stylesheet" href="{% static '/src/assets/css/plugins/swiper-bundle.min.css' %}">
    <link rel="stylesheet" href="{% static '/src/assets/css/plugins/glightbox.min.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700&family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500&display=swap"
          rel="stylesheet">

    <!-- Plugin css -->
    <link rel="stylesheet" href="{% static '/src/assets/css/vendor/bootstrap.min.css' %}">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="{% static '/src/assets/css/style.css' %}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- gettext() для строк в static/js -->
    <script src="{% url 'javascript-catalog' %}"></script>
    <!-- В <head>, чтобы initWishlistButtons() был определён к инлайн-вызовам в теле страницы -->
    <script src="{% static 'src/assets/js/manageFavorites.js' %}"></script>
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
<div class="body__wrapper">
    <header>{% include "partials/header.html" %}</header>
    {% if messages %}
        <div class="site-messages">
            {% for message in messages %}
                <div class="site-messages__item site-messages__item--{{ message.tags }}">
                    {{ message }}
                    <button type="button" class="site-messages__close" aria-label="{% translate "Закрыть" %}">&times;</button>
                </div>
            {% endfor %}
        </div>
        <script>
            document.addEventListener('click', event => {
                const closeBtn = event.target.closest('.site-messages__close');
                if (closeBtn) closeBtn.closest('.site-messages__item').remove();
            });
        </script>
    {% endif %}
    <main class="main__content_wrapper">
        {% block content %} {% endblock %}
    </main>
    <footer>{% include "partials/footer.html" %}</footer>
</div>
<!-- Подключено безусловно, а не через дочерний блок скриптов: часть страниц
     переопределяет его целиком и не наследует родительское содержимое. -->
<script src="{% static 'src/assets/js/cartActions.js' %}"></script>
<script src="{% static 'src/assets/js/compare.js' %}"></script>
</body>
{% block scripts %}{% endblock %}
</html>
